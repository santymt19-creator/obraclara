<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ObraClara · Portal del titular de la entidad</title>
<style>
  :root{
    --bg:#F4F6F8; --card:#FFFFFF; --ink:#0F1B2D; --muted:#556070; --line:#E3E8EE;
    --brand:#0B6E5B; --brand-bg:#E6F4EF; --warn:#8A5300; --warn-bg:#FFF4E0;
    --bad:#A12A2A; --bad-bg:#FDECEC; --info:#1F4E99; --info-bg:#E8F0FB; --navy:#0F1B2D; --navy2:#1E2E45;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,"Segoe UI",system-ui,sans-serif;font-size:15px}
  a{color:var(--brand)}
  .layout{display:flex;flex-wrap:wrap;min-height:100vh}
  aside.menu{flex:1 1 230px;background:var(--navy);color:#fff;padding:22px 14px;display:flex;flex-direction:column;gap:18px}
  .logo{font-size:22px;font-weight:700;padding:0 8px;letter-spacing:-.3px}
  .logo small{display:block;font-size:12px;font-weight:500;color:#C9D3DF;letter-spacing:0}
  .menu label{font-size:12px;color:#C9D3DF;padding:0 8px}
  .menu select{width:100%;min-height:44px;border-radius:10px;border:0;padding:0 10px;font:inherit;background:var(--navy2);color:#fff}
  .menu nav{display:flex;flex-direction:column;gap:4px}
  .menu nav button{all:unset;cursor:pointer;min-height:44px;padding:0 12px;border-radius:10px;color:#C9D3DF;display:flex;align-items:center;gap:10px;font-size:14px}
  .menu nav button[aria-current="page"]{background:var(--navy2);color:#fff;font-weight:600}
  .menu nav button:focus-visible{outline:2px solid #fff}
  .badge-ej{margin:0 8px;font-size:12px;background:#F5C46B;color:#3D2A00;border-radius:8px;padding:6px 8px;font-weight:600}
  main{flex:999 1 560px;min-width:0;padding:26px clamp(14px,3vw,40px);display:flex;flex-direction:column;gap:22px}
  header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
  header.top h1{margin:0;font-size:28px;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:14px}
  .btn{min-height:44px;padding:0 16px;border-radius:10px;border:1px solid #C9D3DF;background:#fff;color:var(--ink);font:inherit;font-size:14px;font-weight:600;cursor:pointer}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
  .card{background:var(--card);border-radius:16px;padding:18px;box-shadow:0 1px 2px rgba(15,27,45,.08)}
  .kpi .lbl{font-size:13px;color:var(--muted)}
  .kpi .val{font-size:28px;font-weight:700;margin-top:4px}
  .bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
  .bar>div{height:8px;background:var(--brand)}
  .pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;white-space:nowrap}
  .ok{background:#E3F3EA;color:#0B6E4F} .warn{background:var(--warn-bg);color:var(--warn)}
  .bad{background:var(--bad-bg);color:var(--bad)} .info{background:var(--info-bg);color:var(--info)}
  .lila{background:#EFEAFB;color:#5B3E96} .gris{background:#ECEEF1;color:#46505C}
  h2{margin:0 0 12px;font-size:18px}
  .tbl-wrap{overflow-x:auto}
  table{width:100%;min-width:720px;border-collapse:collapse;font-size:14px}
  th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;padding:10px 8px;border-bottom:1px solid var(--line)}
  td{padding:11px 8px;border-bottom:1px solid #EEF1F4;vertical-align:middle}
  td.num,th.num{text-align:right}
  .star{all:unset;cursor:pointer;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#9AA6B5}
  .star[aria-pressed="true"]{color:#C77700}
  .star:focus-visible{outline:2px solid var(--brand)}
  .tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
  .tools input,.tools select{min-height:42px;border-radius:10px;border:1px solid #C9D3DF;padding:0 12px;font:inherit;font-size:14px;background:#fff}
  .list{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;gap:12px;align-items:flex-start}
  .item .ttl{font-weight:600}
  .item .meta{font-size:13px;color:var(--muted)}
  .sec{border-left:0}
  .rep-sec{margin-top:6px}
  .rep-sec h3{margin:14px 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .rep-sec ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
  .empty{color:var(--muted);font-size:14px;margin:0}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{all:unset;cursor:pointer;min-height:36px;padding:0 14px;border-radius:999px;border:1px solid #C9D3DF;background:#fff;font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
  .chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  .chip:focus-visible{outline:2px solid var(--brand)}
  .chip .n{font-weight:500;opacity:.75}
  .news{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid #EEF1F4}
  .news:last-child{border-bottom:0}
  .ava{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
  .news a.t{color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;line-height:1.35}
  .news a.t:hover{color:var(--brand);text-decoration:underline}
  .news .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .nuevo{background:#E8590C;color:#fff;border-radius:6px;font-size:11px;font-weight:700;padding:2px 6px}
  .dia{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;margin:14px 0 2px;text-transform:uppercase}
  .destacada{background:var(--navy);color:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
  .destacada a{color:#fff;text-decoration:none;font-size:20px;font-weight:700;line-height:1.3}
  .destacada a:hover{text-decoration:underline}
  .destacada .meta{color:#C9D3DF;font-size:13px}
  .search{min-height:44px;border-radius:12px;border:1px solid #C9D3DF;padding:0 14px;font:inherit;font-size:15px;width:min(100%,420px);background:#fff}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:14px;display:none}
  @media print{
    aside.menu,.no-print,.tools{display:none!important}
    body{background:#fff}
    main{padding:0}
    .card{box-shadow:none;border:1px solid #ccc}
  }

  :root{
    --bg:#F3F4F2; --card:#FFFFFF; --ink:#1F2A26; --muted:#58615D; --line:#E2E6E3;
    --brand:#007A49; --brand-bg:#E3F3EA; --warn:#7A4E00; --warn-bg:#FFF2DB;
    --bad:#A12A2A; --bad-bg:#FDECEC; --info:#1F4E99; --info-bg:#E8F0FB;
    --navy:#003A2A; --navy2:#0B4D39; --gold:#C5891F; --gold-ink:#2B1D00;
  }
  :root, :root[data-tema="azul"]{
    --bg:#F2F4F8; --brand:#1D5FA8; --brand-bg:#E7F0FB; --navy:#0F2A4A; --navy2:#1C3D66;
    --gold:#F2A541; --gold-ink:#2B1A00; --cab-sub:#B9C9DE; --cab-borde:#7F9BBD;
  }
  :root[data-tema="verde"]{
    --bg:#F3F4F2; --brand:#007A49; --brand-bg:#E3F3EA; --navy:#003A2A; --navy2:#0B4D39;
    --gold:#C5891F; --gold-ink:#2B1D00; --cab-sub:var(--cab-sub); --cab-borde:#6F9C88;
  }
  :root[data-tema="vino"]{
    --bg:#F6F2F3; --brand:#8E2442; --brand-bg:#F8E8EE; --navy:#4A1426; --navy2:#66203A;
    --gold:#D9A441; --gold-ink:#2B1A00; --cab-sub:#E2C4CE; --cab-borde:#A86A80;
  }
  [hidden]{display:none!important}
  body{background:var(--bg)}
  .verde{color:var(--brand)}
  .wrap{max-width:1240px;margin:0 auto;padding:0 clamp(14px,3vw,32px)}
  .topbar{background:#fff;border-bottom:1px solid var(--line)}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:58px;flex-wrap:wrap}
  .marca{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--navy);letter-spacing:-.3px}
  .marca small{display:block;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
  .usuario{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
  .usuario b{color:var(--ink)}
  .cabecera{background:var(--navy);color:#fff;border-bottom:4px solid var(--gold)}
  .cabecera .wrap{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;padding-top:26px;padding-bottom:22px}
  .cabecera .tipo{font-size:13px;color:var(--cab-sub);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .cabecera h2{margin:4px 0 0;font-size:clamp(22px,3vw,32px);line-height:1.15;color:#fff}
  .cabecera .mia{display:inline-block;margin-top:8px;background:var(--gold);color:var(--gold-ink);font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px}
  .cambio{display:flex;flex-direction:column;gap:6px;min-width:min(100%,340px)}
  .cambio label{font-size:12px;color:var(--cab-sub);font-weight:600}
  .cambio .fila{display:flex;gap:8px;flex-wrap:wrap}
  .cambio input{flex:1;min-width:200px;min-height:44px;border-radius:10px;border:0;padding:0 12px;font:inherit;font-size:14px}
  .cambio button{min-height:44px;border-radius:10px;border:1px solid var(--cab-borde);background:transparent;color:#fff;font:inherit;font-size:13px;font-weight:600;padding:0 12px;cursor:pointer}
  .ticker{background:var(--gold);color:var(--gold-ink);overflow:hidden}
  .ticker .wrap{display:flex;align-items:center;gap:14px;min-height:44px}
  .ticker .lbl{flex:none;background:var(--navy);color:#fff;font-size:12px;font-weight:800;letter-spacing:.06em;border-radius:6px;padding:4px 8px}
  .ticker .vent{overflow:hidden;flex:1;min-width:0}
  .ticker .cinta{display:inline-flex;gap:40px;white-space:nowrap;animation:correr 60s linear infinite;font-weight:700;font-style:italic;font-size:14px}
  .ticker .cinta a{color:var(--gold-ink);text-decoration:none}
  .ticker .cinta a:hover{text-decoration:underline}
  .ticker:hover .cinta{animation-play-state:paused}
  @keyframes correr{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  @media (prefers-reduced-motion: reduce){.ticker .cinta{animation:none}}
  .accesos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:-1px;padding:18px 0}
  .acceso{all:unset;cursor:pointer;background:#fff;border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px;box-shadow:0 1px 2px rgba(0,58,42,.1);border-bottom:4px solid transparent;font-weight:700;font-size:15px;color:var(--navy);min-height:44px}
  .acceso svg{flex:none;color:var(--brand)}
  .acceso[aria-current="page"]{border-bottom-color:var(--brand);background:var(--brand-bg)}
  .acceso:focus-visible{outline:2px solid var(--brand)}
  main{display:flex;flex-direction:column;gap:22px;padding:0 0 40px;flex:none;min-width:0}
  header.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
  header.top h1{margin:0;font-size:28px;font-weight:400;letter-spacing:-.3px;color:var(--ink)}
  header.top h1 .verde{font-weight:800}
  .pie{background:var(--navy);color:var(--cab-sub);font-size:13px}
  .pie .wrap{padding-top:18px;padding-bottom:18px;display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
  .pie b{color:#fff}
  /* acceso */
  .login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy);padding:20px;box-sizing:border-box}
  .login form{background:#fff;border-radius:18px;padding:28px;width:min(100%,380px);display:flex;flex-direction:column;gap:14px;border-top:6px solid var(--gold)}
  .login h1{margin:0;font-size:26px;color:var(--navy)}
  .login label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
  .login input{min-height:46px;border-radius:10px;border:1px solid #C9D3CE;padding:0 12px;font:inherit;font-size:16px}
  .login .err{color:var(--bad);font-size:13px;min-height:18px;margin:0}
  .btn.primary{background:var(--brand);border-color:var(--brand)}

  /* ranking e historia */
  .rks{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
  .rk{background:var(--brand-bg);border-radius:14px;padding:12px;text-align:center}
  .rk-n{font-size:30px;font-weight:800;color:var(--brand);line-height:1}
  .rk-n span{font-size:14px;font-weight:600;color:var(--muted)}
  .rk-t{font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
  .vecinas{display:flex;flex-direction:column;gap:4px}
  .vec{all:unset;cursor:pointer;display:grid;grid-template-columns:36px minmax(0,1.3fr) minmax(60px,1fr) 52px;gap:8px;align-items:center;padding:5px 6px;border-radius:8px;font-size:13px}
  .vec:hover{background:var(--brand-bg)}
  .vec:focus-visible{outline:2px solid var(--brand)}
  .vec.mia{background:var(--gold);color:var(--gold-ink);font-weight:700;cursor:default}
  .vp{color:var(--muted);font-weight:700;text-align:right}
  .vec.mia .vp{color:var(--gold-ink)}
  .vn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vb{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
  .vb span{display:block;height:8px;background:var(--brand);transform-origin:left;animation:llenar .9s ease both}
  .vv{text-align:right;font-variant-numeric:tabular-nums}
  .hist{display:flex;align-items:flex-end;gap:6px;height:220px;padding-top:10px}
  .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;cursor:default}
  .cbar{width:100%;max-width:44px;background:var(--brand-bg);border-radius:6px 6px 0 0;display:flex;align-items:flex-end;transform-origin:bottom;animation:crecer .9s cubic-bezier(.2,.7,.2,1) both}
  .cdev{width:100%;background:var(--brand);border-radius:6px 6px 0 0}
  .col:hover .cbar{filter:brightness(.92)}
  .cp{font-size:11px;font-weight:700;color:var(--ink);margin-bottom:4px}
  .cy{font-size:11px;color:var(--muted);margin-top:4px}
  @keyframes crecer{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  @media (prefers-reduced-motion: reduce){.cbar,.vb span{animation:none}}

  /* gráficos */
  .graficos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:20px}
  .graf{width:100%;height:auto;display:block}
  .graf .gl{stroke:var(--line);stroke-width:1}
  .graf .ax{font-size:11px;fill:var(--muted)}
  .graf .gb{fill:var(--brand);opacity:.85;transform-box:fill-box;transform-origin:bottom;animation:crecer .8s cubic-bezier(.2,.7,.2,1) both}
  .graf .gb:hover{opacity:1}
  .graf .gl1{fill:none;stroke:var(--gold);stroke-width:3;stroke-linejoin:round}
  .graf .gl1-p{fill:#fff;stroke:var(--gold);stroke-width:2.5}
  .graf .gl2{fill:none;stroke:#8B95A3;stroke-width:2;stroke-dasharray:5 4}
  .graf .gl2-p{fill:#fff;stroke:#8B95A3;stroke-width:2}
  .leyenda{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
  .leyenda i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  .leyenda .lb{background:var(--brand)} .leyenda .ll{background:var(--gold);height:3px;vertical-align:3px} .leyenda .ll2{border-top:2px dashed #8B95A3;height:0;vertical-align:3px}
  tr.fila-sel td{background:var(--brand-bg)}
  @media (prefers-reduced-motion: reduce){.graf .gb{animation:none}}
  .sel-anio{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--muted)}
  .sel-anio select{font:inherit;font-weight:700;color:var(--ink);padding:7px 30px 7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
  button.rk{font:inherit;cursor:pointer;border:2px solid transparent;text-align:center}
  button.rk.sel{border-color:var(--brand)}
  .rk-n,.rk-t{display:block}
  .vn small{color:var(--muted);font-weight:400}
  .vec-sep{text-align:center;color:var(--muted);line-height:1}
  .recordar{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted)}
  /* animaciones */
  @keyframes aparecer{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes llenar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  @keyframes latido{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
  .animar > *{animation:aparecer .5s cubic-bezier(.2,.7,.2,1) both}
  .animar .news{animation:aparecer .45s ease both}
  .bar>div{transform-origin:left;animation:llenar 1s cubic-bezier(.2,.7,.2,1) both .2s}
  .card,.acceso,.destacada,.ir{transition:transform .2s ease, box-shadow .2s ease, background .2s ease}
  .ir{cursor:pointer}
  .ir:hover,.acceso:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(15,42,74,.14)}
  .acceso:hover svg{animation:latido .6s ease}
  button.pill{border:0;cursor:pointer;font:inherit;font-size:12px;font-weight:700}
  button.pill:hover{filter:brightness(.95);transform:translateY(-1px)}
  .alerta{all:unset;display:block;cursor:pointer;border-radius:10px;padding:6px;margin:-6px}
  .alerta:hover{background:var(--brand-bg)}
  .alerta:focus-visible{outline:2px solid var(--brand)}
  .nuevo{animation:latido 1.6s ease infinite}
  /* temas de color: selector */
  .temas{display:flex;gap:6px;align-items:center}
  .tema{all:unset;cursor:pointer;width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #C9D3DF}
  .tema[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand)}
  .tema:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  /* fotos de noticias */
  .thumb{position:relative;flex:none;width:132px;height:88px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#fff}
  .thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
  .news:hover .thumb img{transform:scale(1.08)}
  .ilus-obras{background:linear-gradient(135deg,#1D5FA8,#0F2A4A)}
  .ilus-control{background:linear-gradient(135deg,#A12A2A,#5A1420)}
  .ilus-gestion{background:linear-gradient(135deg,#0E7C66,#0F3D35)}
  .ilus-emerg{background:linear-gradient(135deg,#E07A2F,#8A3B0E)}
  .ilus-otros{background:linear-gradient(135deg,#5B6B7F,#2C3644)}
  .destacada{position:relative;overflow:hidden;min-height:220px;justify-content:flex-end;background-size:cover;background-position:center}
  .destacada::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05) 0%,rgba(0,0,0,.78) 100%)}
  .destacada > *{position:relative}
  .destacada .ico{position:absolute;right:24px;top:20px;opacity:.25}
  @media (max-width:560px){.thumb{width:96px;height:72px}}
  @media (prefers-reduced-motion: reduce){.animar > *,.animar .news,.bar>div,.nuevo,.acceso:hover svg{animation:none}.ir:hover,.acceso:hover{transform:none}}

  @media print{ .topbar,.cabecera,.ticker,.accesos,.pie{display:none!important} }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form id="formLogin" autocomplete="off">
    <div class="marca"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 20h20"/><path d="M5 20V9l7-5 7 5v11"/><path d="M9 20v-6h6v6"/></svg><div>ObraClara<small>Portal del titular</small></div></div>
    <h1>Ingresar</h1>
    <label>DNI<input id="dni" inputmode="numeric" maxlength="12" required></label>
    <label>Clave (si le asignaron una)<input id="clave" type="password"></label>

<script>
/* Modo web (GitHub Pages): los datos vienen cifrados; se descifran en el navegador con DNI + clave. */
(function(){
  if(window.OBRACLARA_DATOS || !window.OC_ACC || !window.OC_ENC) return;
  var A = window.OC_ACC;
  function b64(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function b64e(u){ var s = ""; for(var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function hex(u){ return Array.prototype.map.call(u, function(x){ return ("0" + x.toString(16)).slice(-2); }).join(""); }
  var S = crypto.subtle;
  function ctr(llave, iv, datos){ return S.importKey("raw", llave, "AES-CTR", false, ["decrypt"]).then(function(k){ return S.decrypt({name:"AES-CTR", counter:iv, length:64}, k, datos); }).then(function(r){ return new Uint8Array(r); }); }

    var e = window.OC_ENC.datos;
    return ctr(llave, b64(e.i), b64(e.d)).then(function(z){
      return new Response(new Blob([z]).stream().pipeThrough(new DecompressionStream("deflate"))).text();
    }).then(function(t){ return JSON.parse(t); });
  }
  function arrancar(llave, perfil){
    return abrirDatos(llave).then(function(D){
      perfil.h = "web"; D.usuarios = [perfil];
      window.OBRACLARA_DATOS = D; window.OC_WEB_USUARIO = perfil;
      window.__ocMain && window.__ocMain();
    });
  }
  function guardar(llave, perfil, recordar){
    var v = JSON.stringify({k: b64e(llave), p: perfil});
    try{ sessionStorage.setItem("oc_web", v); if(recordar) localStorage.setItem("oc_web", v); }catch(e){}
  }
  window.__ocWebSalir = function(){ try{ sessionStorage.removeItem("oc_web"); localStorage.removeItem("oc_web"); }catch(e){} location.reload(); };
  window.__ocWebPendiente = true;
  document.addEventListener("DOMContentLoaded", function(){
    var g = null; try{ g = sessionStorage.getItem("oc_web") || localStorage.getItem("oc_web"); }catch(e){}
    if(g){ try{ g = JSON.parse(g); arrancar(b64(g.k), g.p).catch(function(){ window.__ocWebSalir(); }); return; }catch(e){} }
    var lg = document.getElementById("login"), f = document.getElementById("formLogin"), err = document.getElementById("errLogin"), bt = f.querySelector("button");
    var rec = document.createElement("label"); rec.className = "recordar"; rec.innerHTML = '<input type="checkbox" id="recordar"> Recordarme en este equipo';
    bt.parentNode.insertBefore(rec, bt);
    lg.hidden = false; document.getElementById("dni").focus();
    f.addEventListener("submit", function(ev){
      ev.preventDefault(); ev.stopImmediatePropagation();
      if(!S || !window.DecompressionStream){ err.textContent = "Este navegador es muy antiguo. Use Chrome, Edge o Safari actualizados."; return; }
      var dni = document.getElementById("dni").value.replace(/\D/g, ""), clave = document.getElementById("clave").value.trim();

      bt.disabled = true; bt.textContent = "Verificando..."; err.textContent = "";
      var cred = new TextEncoder().encode(dni + ":" + clave);
      S.importKey("raw", cred, "PBKDF2", false, ["deriveBits"]).then(function(base){
        return S.deriveBits({name:"PBKDF2", hash:"SHA-256", salt:b64(A.s), iterations:A.n}, base, 256);
      }).then(function(kd){
        kd = new Uint8Array(kd);
        return S.digest("SHA-256", kd).then(function(h){
          var u = A.u[hex(new Uint8Array(h)).slice(0, 24)];
          if(!u) throw new Error("credenciales");
          return ctr(kd, b64(u[0]), b64(u[1]));
        });
      }).then(function(p){
        var llave = p.slice(0, 32), perfil = JSON.parse(new TextDecoder().decode(p.slice(32)));
        guardar(llave, perfil, document.getElementById("recordar").checked);
        bt.textContent = "Abriendo datos...";
        return arrancar(llave, perfil);
      }).catch(function(e){
        bt.disabled = false; bt.textContent = "Ingresar";
        err.textContent = e && e.message === "credenciales" ? "DNI o clave incorrectos. Si no tiene acceso, comuníquese con el administrador." : "No se pudieron abrir los datos: " + (e && e.message || e);
      });
    }, true);
  });
})();

  }
  // ---------- utilidades ----------
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

    lista.forEach(function(n){ var g = grupo(n.fecha); (grupos[g] = grupos[g] || []).push(n); });
    var cuerpo = orden.filter(function(g){ return grupos[g]; }).map(function(g){ return '<div class="dia">' + g + ' · ' + grupos[g].length + '</div>' + grupos[g].map(function(n){ return itemNoticia(n, visto); }).join(""); }).join("");
    return top("Noticias", (todas.length ? todas.length + " noticias de los últimos 30 días" : "Sin noticias cargadas") + (nuevos ? ' · <b style="color:#E8590C">' + nuevos + ' nuevas desde su última visita</b>' : "") + (D.generado ? " · búsqueda: " + esc(D.generado) : ""),
        '<a class="btn primary" style="display:inline-flex;align-items:center;text-decoration:none" href="' + linkGoogle() + '" target="_blank" rel="noopener">Buscar ahora en Google Noticias</a>') +
      (dest ? '<section class="destacada ' + (dest.img ? '' : ilus(dest)[0]) + '"' + (dest.img ? ' style="background-image:url(&quot;' + esc(dest.img) + '&quot;)"' : '') + '>' + (dest.img ? '' : '<span class="ico">' + icono(ilus(dest)[1], 120) + '</span>') + '<span class="pill" style="align-self:flex-start;background:#F5C46B;color:#3D2A00">DESTACADA · ' + esc(e.nombre) + '</span><a href="' + esc(dest.url) + '" target="_blank" rel="noopener">' + esc(dest.titulo) + '</a><span class="meta">' + esc(dest.fuente) + ' · ' + rel(dest.fecha) + ' · ' + esc(temasDe(dest).join(", ")) + '</span></section>' : '') +
      '<section class="card" style="display:flex;flex-direction:column;gap:12px">' +
        '<label for="nq" class="sub">Buscar en las noticias</label><input id="nq" class="search" type="search" placeholder="Ej.: agua, Contraloría, alcalde…" value="' + esc(state.nQ || "") + '">' +
        '<div class="chips" role="group" aria-label="Alcance">' + chipsNiv + '</div>' +
        '<div class="chips" role="group" aria-label="Tema">' + chipsTema + '</div>' +
      '</section>' +
      '<section class="card">' + (cuerpo || '<p class="empty">No hay noticias con esos filtros. Pruebe «Todo» o use «Buscar ahora en Google Noticias».</p>') + '</section>';
  }
  function widgetNoticias(){
    var ns = noticiasEnt().filter(function(n){ return nivelDe(n) === "municipalidad" || nivelDe(n) === "provincia"; }).slice(0, 4);
    if(!ns.length) return "";
    return '<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">Últimas noticias de su zona</h2><button class="btn" data-go="noticias">Ver todas</button></div>' +
      ns.map(function(n){ return itemNoticia(n, state.nVisto); }).join("") + '</section>';
  }

  function top(t, sub, botones){
    var w = t.split(" "), ult = w.pop();
    return '<header class="top"><div><h1>' + (w.length ? esc(w.join(" ")) + ' ' : '') + '<span class="verde">' + esc(ult) + '</span></h1><div class="sub">' + sub + '</div></div>' +
      (botones ? '<div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap">' + botones + '</div>' : '') + '</header>';
  }
  function kpi(l, v, s){ return '<div class="card kpi"><div class="lbl">' + l + '</div><div class="val">' + v + '</div>' + (s ? '<div class="sub" style="margin-top:6px">' + s + '</div>' : '') + '</div>'; }
  function mini(n, l, c){ return '<div class="' + c + ' ir" data-go="semanal" role="button" tabindex="0" style="border-radius:12px;padding:12px"><div style="font-size:24px;font-weight:700">' + n + '</div><div style="font-size:13px;font-weight:600">' + l + '</div></div>'; }

  // ---------- acceso ----------
  function propia(){ return state.user && state.user.entidad ? state.user.entidad : null; }
  function entrar(u){
    state.user = u;
    var pref = store("oc_entidad");
    state.entidad = (u && u.entidad && entPorId[u.entidad]) ? u.entidad
                  : (pref && entPorId[pref]) ? pref
                  : (entidades.filter(function(e){ return e.foco; })[0] || entidades[0]).id;
    document.getElementById("login").hidden = true;
    document.getElementById("app").hidden = false;
    document.getElementById("quien").innerHTML = u ? '<b>' + esc(u.nombre) + '</b>' + (u.cargo ? ' · ' + esc(u.cargo) : '') : '<b>Acceso libre</b>';
    document.getElementById("salir").hidden = !u;
    var lista = entidades.slice().sort(function(a, b){ return (b.foco - a.foco) || a.nombre.localeCompare(b.nombre); });
    state.animar = true;
    document.getElementById("listaEnt").innerHTML = lista.map(function(e){ return '<option value="' + esc(e.nombre + (e.provincia ? " (" + e.provincia + ")" : "")) + '">'; }).join("");
    render();
  }
  function mostrarLogin(){
    document.getElementById("app").hidden = true;
    document.getElementById("login").hidden = false;
    document.getElementById("dni").focus();
  }
  document.getElementById("formLogin").addEventListener("submit", function(ev){
    ev.preventDefault();
    var dni = document.getElementById("dni").value.replace(/\D/g, ""), clave = document.getElementById("clave").value.trim();
    var h = sha256(utf8(dni + ":" + clave));
    var u = usuarios.filter(function(x){ return x.h === h; })[0];
    if(!u){ document.getElementById("errLogin").textContent = "DNI o clave incorrectos. Si no tiene acceso, comuníquese con el administrador."; return; }
    store("oc_sesion", h);
    document.getElementById("errLogin").textContent = "";
    entrar(u);
  });
  document.getElementById("salir").addEventListener("click", function(){ if(WEB){ window.__ocWebSalir(); return; } store("oc_sesion", ""); state.user = null; mostrarLogin(); });
  document.getElementById("buscaEnt").addEventListener("change", function(){
    var v = this.value.trim().toLowerCase();
    var e = entidades.filter(function(x){ return (x.nombre + (x.provincia ? " (" + x.provincia + ")" : "")).toLowerCase() === v; })[0]
         || entidades.filter(function(x){ return x.nombre.toLowerCase().indexOf(v) >= 0; })[0];
    if(e){ state.entidad = e.id; store("oc_entidad", e.id); state.filtro = ""; state.estado = ""; state.lugar = ""; this.value = ""; state.animar = true; render(); }
    else toast("No se encontró esa entidad.");
  });
  document.getElementById("volver").addEventListener("click", function(){ if(propia()){ state.entidad = propia(); state.animar = true; render(); } });
  document.querySelectorAll(".accesos .acceso").forEach(function(b){
    b.addEventListener("click", function(){ ir(b.dataset.tab); });
  });

  // ---------- render ----------
  function cabecera(){
    var e = ent(), mia = propia() === e.id;
    document.getElementById("cabTipo").textContent = e.tipo + " · " + (e.provincia ? e.provincia + " · " : "") + e.region;
    document.getElementById("cabNombre").textContent = e.nombre;
    document.getElementById("cabMia").hidden = !mia;
    document.getElementById("volver").hidden = !propia() || mia;
    document.getElementById("pieFuente").innerHTML = fuente() + (D.generado ? " · actualizado " + esc(D.generado) : "");
    var ns = noticiasEnt().slice(0, 10), t = document.getElementById("ticker");
    t.hidden = !ns.length;
    if(ns.length){
      var items = ns.map(function(n){ return '<a href="' + esc(n.url) + '" target="_blank" rel="noopener">¡ ' + esc(n.titulo) + ' !</a>'; }).join("");
      document.getElementById("cinta").innerHTML = items + items;
    }
  }
  function ir(tab){ state.tab = tab; state.animar = true; render(); window.scrollTo({top: 0, behavior: "smooth"}); }
  function contar(){
    if(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    main.querySelectorAll(".kpi .val, .ir > div:first-child").forEach(function(el){
      var m = el.textContent.match(/^(\D*?)([\d.,]+)(.*)$/);
      if(!m || el.children.length > 1) return;
      var txt = m[2], dec = (txt.split(".")[1] || "").length, fin = parseFloat(txt.replace(/,/g, ""));
      if(!(fin > 0)) return;
      var t0 = null, pre = m[1], suf = m[3], base = el.innerHTML;
      function paso(t){
        if(!t0) t0 = t;
        var k = Math.min(1, (t - t0) / 900), v = fin * (1 - Math.pow(1 - k, 3));
        el.textContent = pre + v.toLocaleString("es-PE", {minimumFractionDigits: dec, maximumFractionDigits: dec}) + suf;
        if(k < 1) requestAnimationFrame(paso); else el.innerHTML = base;
      }
      requestAnimationFrame(paso);
    });
  }
  function aplicarTema(t){
    document.documentElement.setAttribute("data-tema", t);
    document.querySelectorAll(".tema").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.t === t); });
    store("oc_tema", t);
  }
  aplicarTema(store("oc_tema") || "azul");
  document.querySelectorAll(".tema").forEach(function(b){ b.addEventListener("click", function(){ aplicarTema(b.dataset.t); }); });
  function render(){
    if(!state.entidad) return;
    cabecera();
    document.querySelectorAll(".accesos .acceso").forEach(function(b){
      if(b.dataset.tab === state.tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
    });
    var vistas = { resumen:vResumen, obras:vObras, semanal:vSemanal, noticias:vNoticias, pp:vPP };
    main.innerHTML = (vistas[state.tab] || vResumen)();
    if(state.animar){
      state.animar = false;
      main.classList.remove("animar"); void main.offsetWidth; main.classList.add("animar");
      [].forEach.call(main.children, function(c, i){ c.style.animationDelay = (i * 70) + "ms"; });
      [].forEach.call(main.querySelectorAll(".news"), function(c, i){ if(i < 20) c.style.animationDelay = (150 + i * 40) + "ms"; });
      contar();
    } else main.classList.remove("animar");
    main.querySelectorAll("[data-ir-estado]").forEach(function(b){ b.onclick = function(){ state.estado = b.dataset.irEstado; state.filtro = ""; ir("obras"); }; b.onkeydown = function(ev){ if(ev.key === "Enter") b.onclick(); }; });
    main.querySelectorAll("[data-ir-cui]").forEach(function(b){ b.onclick = function(){ state.filtro = b.dataset.irCui; state.estado = ""; ir("obras"); }; });
    main.querySelectorAll("[data-go]").forEach(function(b){ b.onclick = function(){ ir(b.dataset.go); }; b.onkeydown = function(ev){ if(ev.key === "Enter") ir(b.dataset.go); }; });
    main.querySelectorAll("[data-fav]").forEach(function(b){ b.onclick = function(){ toggleFav(b.dataset.fav); }; });
    main.querySelectorAll("[data-nivel]").forEach(function(b){ b.onclick = function(){ state.nNivel = b.dataset.nivel; state.nTema = ""; render(); }; });
    main.querySelectorAll("[data-tema]").forEach(function(b){ b.onclick = function(){ state.nTema = b.dataset.tema; render(); }; });
    function vivo(id, campo){
      var el = document.getElementById(id);
      if(el) el.oninput = function(){ state[campo] = el.value; var pos = el.selectionStart; render(); var n = document.getElementById(id); n.focus(); n.setSelectionRange(pos, pos); };
    }
    vivo("q", "filtro"); vivo("nq", "nQ");
    var lg = document.getElementById("lugar");
    if(lg){ lg.onchange = function(){ state.lugar = lg.value.trim(); state.estado = ""; state.animar = true; render(); }; }
    var ql = document.getElementById("limpiarLugar"); if(ql) ql.onclick = function(){ state.lugar = ""; state.estado = ""; render(); };
    main.querySelectorAll("[data-lugar]").forEach(function(b){ b.onclick = function(){ state.lugar = (sinTilde(state.lugar) === sinTilde(b.dataset.lugar)) ? "" : b.dataset.lugar; state.estado = ""; state.animar = true; render(); }; });
    main.querySelectorAll("[data-grupo]").forEach(function(b){ var fn = function(){ var g = "g:" + b.dataset.grupo; state.estado = state.estado === g ? "" : g; render(); }; b.onclick = fn; b.onkeydown = function(ev){ if(ev.key === "Enter") fn(); }; });
    if(state.tab === "noticias" && !vistoGuardado){ vistoGuardado = true; store("oc_news_visto", new Date().toISOString().slice(0, 19) + "Z"); }
    var fe = document.getElementById("fe");
    if(fe){ fe.value = state.estado; fe.onchange = function(){ state.estado = fe.value; render(); }; }
    var imp = document.getElementById("imprimir"); if(imp) imp.onclick = function(){ window.print(); };
    main.querySelectorAll("[data-tipo]").forEach(function(b){ b.onclick = function(){ state.rkTipo = b.dataset.tipo; render(); }; });
    var sa = main.querySelector("#rkAnio"); if(sa) sa.onchange = function(){ state.rkAnio = sa.value; render(); };
    main.querySelectorAll("[data-rkamb]").forEach(function(b){ b.onclick = function(){ state.rkAmbito = b.dataset.rkamb; state.rkTodos = false; render(); }; });
    main.querySelectorAll("[data-rktodos]").forEach(function(b){ b.onclick = function(){ state.rkTodos = !state.rkTodos; render(); }; });
    main.querySelectorAll("[data-ppanio]").forEach(function(b){ b.onclick = function(){ state.ppAnio = b.dataset.ppanio; render(); }; });
    main.querySelectorAll("[data-verent]").forEach(function(b){ b.onclick = function(){ state.entidad = b.dataset.verent; state.lugar = ""; state.estado = ""; state.filtro = ""; ir(state.tab === "pp" ? "obras" : state.tab); }; });
    var cpp = document.getElementById("copiarPP");
    if(cpp) cpp.onclick = function(){ var txt = textoPP(); try{ navigator.clipboard.writeText(txt).then(function(){ toast("Copiado. Péguelo en WhatsApp."); }, function(){ fallback(txt); }); }catch(e){ fallback(txt); } };
    var cop = document.getElementById("copiar");
    if(cop) cop.onclick = function(){
      var txt = textoWhatsApp(reporte());
      try{ navigator.clipboard.writeText(txt).then(function(){ toast("Reporte copiado. Péguelo en WhatsApp."); }, function(){ fallback(txt); }); }
      catch(e){ fallback(txt); }
    };
  }
  function fallback(txt){
    var ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast("Reporte copiado. Péguelo en WhatsApp."); }catch(e){ toast("No se pudo copiar."); }
    document.body.removeChild(ta);
  }

  // ---------- inicio ----------
  if(WEB){ entrar(window.OC_WEB_USUARIO); }
  else if(!usuarios.length){ entrar(null); }
  else{
    var ses = store("oc_sesion"), u = ses && usuarios.filter(function(x){ return x.h === ses; })[0];
    if(u) entrar(u); else mostrarLogin();
  }
};
if(!window.__ocWebPendiente){ if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", window.__ocMain); else window.__ocMain(); }
</script>
</body>
</html>
